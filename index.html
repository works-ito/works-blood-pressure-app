<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>血圧記録 - 認証PoC</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">WORKS</p>
        <h1>血圧記録</h1>
      </div>
      <span class="badge">Phase 0</span>
    </header>

    <section class="card" id="auth-card">
      <div class="status-row">
        <div>
          <span class="status-label">認証状態</span>
          <strong id="auth-status">初期化中…</strong>
        </div>
      </div>

      <div id="signed-out-view" class="hidden">
        <p>社員認証を行います。Auth0 のログイン画面へ進みます。</p>
        <button id="login" class="primary">ログイン</button>
        <p class="hint">Phase 0では、パスワードとPasskeyの両方でログインできることを確認します。</p>
      </div>

      <div id="auth-error" class="hidden"></div>
    </section>

    <section class="card hidden" id="signed-in-card">
      <h2>ログイン成功</h2>
      <dl class="summary">
        <div><dt>Auth0 User ID</dt><dd id="user-id">-</dd></div>
        <div><dt>認証ユーザー</dt><dd id="user-label">-</dd></div>
      </dl>
      <div class="actions">
        <button id="logout" class="danger">ログアウト</button>
      </div>
    </section>

    <section class="card note">
      <h2>このPoCで確認すること</h2>
      <ol>
        <li>パスワードでログインできる</li>
        <li>Passkeyを登録できる</li>
        <li>iPhoneでFace ID等の端末認証による再ログインができる</li>
        <li>Androidで端末認証による再ログインができる</li>
        <li>Passkeyを使えない場合でもパスワードで復旧できる</li>
      </ol>
    </section>
  </main>

  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.24/auth0-spa-js.production.js"></script>
  <script src="app.js"></script>
</body>
</html>
