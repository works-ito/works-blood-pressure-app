<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>血圧記録 - 認証PoC</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">WORKS</p>
        <h1>血圧記録</h1>
      </div>
      <span class="badge">Phase 0</span>
    </header>

    <section class="card" id="config-card">
      <h2>認証PoC</h2>
      <p>Clerk の Publishable Key を設定すると、社員番号＋パスワード認証の実機確認を開始できます。</p>
      <label class="field">
        <span>Clerk Publishable Key</span>
        <input id="publishable-key" autocomplete="off" placeholder="pk_test_..." />
      </label>
      <button id="save-key" class="primary">設定して開始</button>
      <p class="hint">Secret Key は絶対に入力しません。</p>
    </section>

    <section class="card hidden" id="auth-card">
      <div class="status-row">
        <div>
          <span class="status-label">認証状態</span>
          <strong id="auth-status">未確認</strong>
        </div>
        <button id="clear-key" class="text-button">設定解除</button>
      </div>
      <div id="clerk-auth"></div>
    </section>

    <section class="card hidden" id="signed-in-card">
      <h2>ログイン成功</h2>
      <dl class="summary">
        <div><dt>Clerk User ID</dt><dd id="user-id">-</dd></div>
        <div><dt>社員番号</dt><dd id="username">-</dd></div>
      </dl>
      <div class="actions">
        <button id="open-profile" class="secondary">認証情報を管理</button>
        <button id="sign-out" class="danger">ログアウト</button>
      </div>
    </section>

    <section class="card note">
      <h2>このPoCで確認すること</h2>
      <ol>
        <li>社員番号＋パスワードでログインできる</li>
        <li>ログイン状態を安全に維持できる</li>
        <li>ログアウト後に社員番号＋パスワードで再ログインできる</li>
      </ol>
    </section>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
